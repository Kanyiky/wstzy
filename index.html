<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="五术搬财资源库 · 山医命相卜" />
  <title>五术搬财资源库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 楷体 / 宋体 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- 霞鹜文楷：清晰楷书 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />
  <!-- 开源隶书近似：马善政楷书偏碑味，配合系统隶书优先 -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=block" />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=block" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f1e8;
      --surface: #faf7f1;
      --ink: #1a1714;
      --ink-soft: #4a443c;
      --ink-muted: #8a8276;
      --border: rgba(43, 38, 30, 0.12);
      --border-light: rgba(43, 38, 30, 0.08);
      --border-strong: rgba(43, 38, 30, 0.28);
      --accent: #2b261e;
      --hover: rgba(43, 38, 30, 0.04);
      --radius: 4px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --t: 0.35s var(--ease);
      --content: 760px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }
    html, body {
      overflow-x: hidden;
      overflow-y: auto;
      height: auto;
    }

    body {
      font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.8;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      font-size: 16px;
      letter-spacing: 0.02em;
    }

    /* ========== Header ========== */
    header {
      position: relative;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border-light);
      padding: 28px 16px 22px;
    }

    .header-inner {
      max-width: var(--content);
      margin: 0 auto;
      text-align: center;
    }

    .brand { margin-bottom: 20px; }

    .brand h1 {
      font-family: "STLiti", "LiSu", "Baoli SC", "Ma Shan Zheng", "Noto Serif SC", serif;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: var(--ink);
      line-height: 1.35;
    }

    .brand p {
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--ink-muted);
      letter-spacing: 0.22em;
      font-family: "LXGW WenKai", "KaiTi", "STKaiti", serif;
    }

    .search-wrap {
      position: relative;
      max-width: 100%;
      margin: 0 auto 14px;
    }

    .search-wrap input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 0.9rem;
      color: var(--ink);
      outline: none;
      font-family: "Noto Serif SC", "Songti SC", serif;
      transition: border-color var(--t);
    }

    .search-wrap input:focus {
      border-color: var(--border-strong);
      box-shadow: none;
    }

    .search-wrap input::placeholder {
      color: var(--ink-muted);
      letter-spacing: 0.06em;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      opacity: 0.32;
      pointer-events: none;
    }


    /* ===== 分类 · 古目录式 ===== */
    .filters {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 8px 0 4px;
      max-width: 100%;
    }

    .filter-layer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0;
      width: 100%;
      padding: 10px 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .filter-layer::-webkit-scrollbar { display: none; }

    /* 层间细线分隔 */
    .filter-layer.layer2,
    .filter-layer.layer3 {
      border-top: 1px solid rgba(43, 38, 30, 0.08);
    }

    .filter-btn {
      position: relative;
      flex-shrink: 0;
      margin: 0;
      padding: 6px 14px;
      border: none;
      border-radius: 0;
      background: transparent;
      font-family: "LXGW WenKai", "KaiTi", "STKaiti", "Noto Serif SC", serif;
      font-size: 0.88rem;
      color: rgba(42, 38, 30, 0.48);
      cursor: pointer;
      letter-spacing: 0.2em;
      white-space: nowrap;
      transition: color 0.35s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    /* 山医命相卜：字间更疏，像卷首纲目 */
    .filter-layer.layer2 .filter-btn {
      padding: 8px 16px;
      font-size: 1.02rem;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
    }

    .filter-layer.layer3 .filter-btn {
      padding: 7px 12px;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      color: rgba(42, 38, 30, 0.42);
    }

    .filter-layer.layer1 .filter-btn {
      padding: 6px 20px;
      font-size: 0.92rem;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
    }

    .filter-btn:hover {
      color: var(--ink);
      background: transparent;
      border: none;
    }

    .filter-btn:active {
      transform: none;
      opacity: 0.85;
    }

    /* 选中：墨色 + 下短线 */
    .filter-btn.active {
      color: var(--ink);
      background: transparent;
      border: none;
      box-shadow: none;
      font-weight: 500;
    }

    .filter-btn.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 1.1em;
      height: 1px;
      background: rgba(43, 38, 30, 0.55);
      transform: translateX(-50%);
    }


    .filter-layer.layer2 .filter-btn + .filter-btn::before {
      content: "·";
      position: absolute;
      left: -0.15em;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(43, 38, 30, 0.22);
      font-size: 0.85em;
      pointer-events: none;
      letter-spacing: 0;
    }

    .filter-layer.layer2 .filter-btn.active::after {
      width: 0.85em;
      bottom: 4px;
    }

    .filter-layer.layer1 .filter-btn.active::after {
      width: 1.4em;
    }



    /* ===== Main 手机 ===== */
    main {
      max-width: var(--content);
      margin: 0 auto;
      padding: 28px 16px 72px;
    }


    .stats {
      text-align: center;
      font-size: 0.8rem;
      color: var(--ink-muted);
      margin-bottom: 16px;
      letter-spacing: 0.1em;
      font-family: "LXGW WenKai", "KaiTi", serif;
    }

    .stats strong {
      color: var(--ink-soft);
      font-weight: 500;
      font-family: "Noto Serif SC", serif;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* 书目式条目：细线分隔，少框 */
    .card {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(43, 38, 30, 0.08);
      border-radius: 0;
      padding: 22px 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background var(--t), padding var(--t);
      opacity: 0;
      animation: fadeUp 0.45s var(--ease) forwards;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }

    .card:first-child {
      border-top: 1px solid rgba(43, 38, 30, 0.08);
    }

    .card:hover {
      background: rgba(43, 38, 30, 0.03);
      transform: none;
    }

    .card:active {
      background: rgba(43, 38, 30, 0.05);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      font-size: 1.02rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--ink);
      letter-spacing: 0.03em;
      order: 1;
    }

    .card-desc {
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      font-size: 0.86rem;
      color: var(--ink-soft);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      order: 2;
    }

    .card-side {
      order: 3;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 6px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    .card-tag {
      font-size: 0.72rem;
      padding: 3px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--ink-muted);
      font-family: "LXGW WenKai", "KaiTi", "STKaiti", serif;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .card-side a {
      font-size: 0.78rem;
      color: var(--ink-muted);
      text-decoration: none;
      letter-spacing: 0.08em;
      font-family: "LXGW WenKai", "KaiTi", serif;
      transition: color var(--t);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      -webkit-tap-highlight-color: transparent;
    }

    .card-side a:active { color: var(--ink); }

    .card-side a svg {
      width: 12px;
      height: 12px;
    }

    .empty {
      text-align: center;
      padding: 56px 16px;
      color: var(--ink-muted);
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      font-family: "LXGW WenKai", "KaiTi", serif;
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      padding: 28px 16px 40px;
      font-size: 0.72rem;
      color: var(--ink-muted);
      border-top: 1px solid var(--border-light);
      letter-spacing: 0.1em;
      font-family: "LXGW WenKai", "KaiTi", serif;
    }

    /* ========== 平板 ========== */
    @media (min-width: 600px) {
      header { padding: 24px 20px 20px; }
      .brand h1 { font-size: 1.85rem; letter-spacing: 0.16em; }
      .search-wrap { max-width: 440px; }
      .filter-layer {
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 10px;
      }
      .filter-btn {
        font-size: 0.9rem;
        padding: 8px 16px;
      }
      .filter-layer.layer2 .filter-btn { min-width: 0; }
      .filter-layer.layer3 .filter-btn { min-width: 0; }
      main { padding: 24px 20px 64px; }
      .card { padding: 18px 20px; }
    }

    /* ========== 电脑端：大气左右布局 ========== */
    @media (min-width: 860px) {
      body { font-size: 17px; }

      header { padding: 36px 32px 28px; }

      .brand { margin-bottom: 24px; }

      .brand h1 {
        font-size: clamp(2rem, 2.6vw, 2.5rem);
        letter-spacing: 0.2em;
      }

      .brand p {
        font-size: 0.8rem;
        letter-spacing: 0.28em;
        margin-top: 8px;
      }

      .search-wrap {
        max-width: 480px;
        margin-bottom: 22px;
      }

      .search-wrap input {
        padding: 13px 16px 13px 44px;
        font-size: 0.95rem;
        text-align: center;
      }

      .search-wrap input:focus { text-align: left; }

      .filters {
        align-items: center;
        gap: 12px;
      }

      .filter-layer {
        justify-content: center;
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 12px;
      }

      .filters { gap: 0; max-width: 560px; margin: 0 auto; }
      .filter-layer { gap: 0; padding: 12px 8px; }
      .filter-layer.layer2 .filter-btn {
        font-size: 1.12rem;
        padding: 8px 22px;
        letter-spacing: 0.4em;
        text-indent: 0.4em;
      }
      .filter-layer.layer3 .filter-btn {
        font-size: 0.88rem;
        padding: 8px 16px;
        letter-spacing: 0.16em;
      }
      .filter-layer.layer1 .filter-btn {
        font-size: 0.98rem;
        letter-spacing: 0.4em;
        text-indent: 0.4em;
      }
      .filter-btn:hover { transform: none; }
      .filter-btn:active { transform: none; }
main { padding: 40px 32px 96px; }

      .stats {
        font-size: 0.88rem;
        margin-bottom: 24px;
      }

      .list { gap: 20px; }

      /* 电脑：左文右操作 */
      .card {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        column-gap: 24px;
        row-gap: 8px;
        padding: 26px 28px;
      }

      .card:hover {
        transform: translateY(-1px);
        box-shadow: none;
        border-color: var(--border-strong);
      }

      .card-title {
        grid-column: 1;
        grid-row: 1;
        order: unset;
        font-size: 1.18rem;
      }

      .card-desc {
        grid-column: 1;
        grid-row: 2;
        order: unset;
        font-size: 0.95rem;
      }

      .card-side {
        grid-column: 2;
        grid-row: 1 / 3;
        order: unset;
        flex-direction: column;
        align-items: flex-end;
        justify-content: space-between;
        margin-top: 0;
        padding-top: 0;
        border-top: none;
        min-width: 92px;
        gap: 12px;
      }

      .card-tag {
        font-size: 0.78rem;
        padding: 4px 12px;
      }

      .card-side a {
        font-size: 0.84rem;
      }

      .card-side a:hover {
        color: var(--ink);
        transform: translateX(2px);
      }

      .card-side a svg {
        width: 13px;
        height: 13px;
        transition: transform var(--t);
      }

      .card-side a:hover svg {
        transform: translateX(3px);
      }

      footer {
        padding: 32px 20px;
        font-size: 0.78rem;
      }
    }
  
    
    .card-side-link {
      font-size: 0.78rem;
      color: var(--ink-muted);
      letter-spacing: 0.08em;
      font-family: "LXGW WenKai", "KaiTi", serif;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    @media (min-width: 860px) {
      .card-side-link { font-size: 0.84rem; }
      .card:hover .card-side-link { color: var(--ink); }
    }


    /* ===== 详情弹层 · 横向卷轴 ===== */
    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(26, 23, 20, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s var(--ease), visibility 0.35s;
    }

    .modal-mask.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      position: relative;
      width: min(94vw, 720px);
      max-height: none;
      overflow: hidden;
      background: #f7f1e6;
      border: none;
      border-radius: 2px;
      padding: 28px 40px 24px;
      box-sizing: border-box;
      transform: scaleX(0.08);
      transform-origin: center center;
      opacity: 0;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
      box-shadow: 0 8px 28px rgba(26, 23, 20, 0.1);
      border: 1px solid rgba(43, 38, 30, 0.1);
      /* 隐藏滚动条 */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .modal::-webkit-scrollbar { display: none; width: 0; height: 0; }


    .modal-mask.open .modal {
      transform: scaleX(1);
      opacity: 1;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 18px;
      z-index: 4;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(43, 38, 30, 0.15);
      border-radius: 2px;
      background: transparent;
      color: var(--ink-muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--t), color var(--t);
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .modal-close:hover {
      background: rgba(43, 38, 30, 0.06);
      color: var(--ink);
    }

    /* 横向主排版：左文右码 / 左信息右操作 */
    .modal-body {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 28px;
      min-height: 160px;
    }
    .modal-main {
      flex: 1;
      min-width: 0;
      text-align: left;
    }
    .modal-side {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: 160px;
    }

    .modal-tag {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border: 1px solid rgba(43, 38, 30, 0.12);
      border-radius: 2px;
      color: var(--ink-muted);
      font-family: "LXGW WenKai", "KaiTi", serif;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .modal-title {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.45;
      color: var(--ink);
      letter-spacing: 0.04em;
      margin-bottom: 10px;
      padding-right: 28px;
    }

    .modal-desc {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 0.88rem;
      color: var(--ink-soft);
      line-height: 1.7;
      margin-bottom: 14px;
      white-space: pre-wrap;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .modal-download {
      display: inline-block;
      padding: 9px 22px;
      border: none;
      border-radius: 2px;
      background: var(--accent);
      color: #f6f1e8;
      font-size: 0.88rem;
      font-family: "LXGW WenKai", "KaiTi", serif;
      letter-spacing: 0.16em;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--t);
      -webkit-tap-highlight-color: transparent;
    }
    .modal-download:hover { background: #3d362c; }
    .modal-download.is-hidden { display: none !important; }

    .modal-divider {
      display: none;
    }

    .modal-contact {
      text-align: center;
    }
    .modal-contact-title {
      font-family: "LXGW WenKai", "KaiTi", serif;
      font-size: 0.8rem;
      color: var(--ink-soft);
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }
    .modal-qr {
      width: 128px;
      height: 128px;
      border: 1px solid rgba(43, 38, 30, 0.12);
      border-radius: 4px;
      background: #fff;
      object-fit: contain;
      display: block;
    }
    .modal-qr-placeholder {
      width: 128px;
      height: 128px;
      border: 1px dashed rgba(43, 38, 30, 0.15);
      border-radius: 4px;
      background: rgba(43, 38, 30, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      font-size: 0.72rem;
      font-family: "LXGW WenKai", "KaiTi", serif;
      letter-spacing: 0.06em;
      text-align: center;
      padding: 8px;
      box-sizing: border-box;
    }
    .modal-wx {
      font-family: "Noto Serif SC", serif;
      font-size: 0.85rem;
      color: var(--ink-soft);
      margin-top: 4px;
    }
    .modal-wx span {
      font-size: 0.75rem;
      margin-right: 6px;
      font-family: "LXGW WenKai", "KaiTi", serif;
      color: var(--ink-muted);
    }
    .modal-tip {
      font-size: 0.72rem;
      color: var(--ink-muted);
      letter-spacing: 0.06em;
      margin-top: 4px;
      font-family: "LXGW WenKai", "KaiTi", serif;
    }

        /* 手机：上下排布，避免挤乱 */
    @media (max-width: 640px) {
      .modal-mask {
        padding: 16px 12px;
        align-items: center;
      }
      .modal {
        width: min(94vw, 100%);
        max-width: 100%;
        max-height: min(88vh, 640px);
        padding: 36px 20px 22px;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        transform: scaleX(0.12);
      }
      .modal-mask.open .modal {
        transform: scaleX(1);
      }
      .modal-body {
        flex-direction: column;
        align-items: stretch;
        gap: 18px;
        min-height: 0;
      }
      .modal-main {
        width: 100%;
        text-align: center;
      }
      .modal-side {
        width: 100%;
        max-width: none;
        align-items: center;
        padding-top: 12px;
        border-top: 1px solid rgba(43, 38, 30, 0.08);
      }

      { id: "150", title: "张天师符咒大全丨康熙皇室珍藏", desc: "这份和道家符箓有关的，值得你留出一点时间慢慢看。 《张天师符咒大全》，一份围绕道家符箓文化整理的传统文化、民俗知识、古籍整理类资料。 如果你正在了解道家文化、喜欢研究民俗知识、对古籍里的符箓内容好奇，或者想多了解一点老祖宗留下的东西，又或者想给资料库添一份冷门的文化收藏，这份资料可以翻一翻。", categoryName: "山", link: "https://pan.quark.cn/s/ca49c0fb33ac" },
      { id: "149", title: "悬疑猎奇短视频副业，手机就能从0开始做", desc: "这个副业做的是悬疑、猎奇类的短视频内容：用几十秒到两三分钟，讲一个有悬念的故事，或者把一个冷门、有趣的知识讲得让人想看完。形式以\\\"配音＋画面＋字幕\\\"为主，不需要露脸，一部手机加一个剪辑软件就能做。", categoryName: "创业副业", link: "https://pan.quark.cn/s/7dbf06bce1b2" },
      { id: "148", title: "用AI制作田园治愈短片，保姆级上手教程", desc: "这个副业做什么：用AI工具制作\\\"农村治愈、田园慢生活\\\"风格的短视频，发布到短视频、视频号等平台，靠内容积累观众，再通过平台公开的渠道产生收入。 适合谁：有碎片时间、愿意每周固定更新、对乡村和自然题材有感觉的人。上班族、学生、宝妈都可以。不用露脸、不用出镜，手机或电脑都能做。 多久见到反馈：发布后一到两周，通常就能看到播放、完播等数据反馈。至于收入渠道，需要达到平台的开通条件，周期因人而异，需要持续做，没有任何保证。 这类内容观众群体比较稳定，很多人喜欢看安静、解压的乡村画面，但不代表每个人都能做出成绩，关键看你能不能坚持，并不断调整。", categoryName: "创业副业", link: "https://pan.quark.cn/s/67e36d2800e5" },
      { id: "147", title: "七十二行祖师爷", desc: "做哪一行，就拜哪一行的祖师爷。这是民间流传了很久的行业习俗。木匠、铁匠、药铺、茶馆、戏班，三百六十行各有各的说法，各有各的传说。 这些祖师爷和行业守护神是怎么来的？背后有什么故事？这份资料收录了七十二行祖师爷的传说，以及\\\"三百六十行\\\"\\\"五祖不立\\\"\\\"行业守护神\\\"等相关民俗内容。", categoryName: "奇异杂集", link: "https://pan.quark.cn/s/4fd6c7b436ba" },
      { id: "146", title: "星座情感号从0到开通变现的全流程", desc: "这篇是写给完全没做过短视频的人看的，每一步都拆开讲。先说清楚三件事： 做的是\\\"星座性格×情感沟通\\\"的科普娱乐内容，不做运势预测，不做收费测算。 不露脸可以做，但不是不用动脑，原创表达是关键。 这是个需要持续更新的副业，不是一夜见效的事。", categoryName: "创业副业", link: "https://pan.quark.cn/s/731a0591aaab" },

      { id: "75", title: "《中国古代八大兵书》", desc: "读兵书让人受益匪浅 培养战略眼光‌：兵书强调“谋定而后动”，教会人从全局视角思考问题，避免短视和盲目行动。 ‌增强决策能力‌：通过学习“知己知彼”等核心原则，提升对形势的判断力，减少关键节点的决策失误。 助力职场进阶‌：兵法中的竞争策略、团队管理思想，可直接应用于企业管理、市场营销和人际交往。 ‌丰富处世智慧‌：帮助人在复杂关系中保持清醒，学会以退为进、刚柔并济，提升应对挫折的韧性。 ‌涵养品格心性‌：兵书倡导的“将帅五德”（智、信、仁、勇、严），有助于修身养德，塑造沉稳坚毅的心理素质。 ‌拓宽认知格局‌：阅读经典兵书能了解历史规律和战争哲学，站在更高维度审视人生，提升眼界和格局。 该资源包含孙膑兵书、吴起兵书、三十六计、姜太公兵书、曾国藩兵书、春秋、尉缭子兵书。", categoryName: "奇异杂集", link: "https://pan.quark.cn/s/b14c6a42fcc6" },

      { id: "56", title: "90年代书籍《皇室秘方大全》", desc: "90年代书籍《皇室秘方大全》全书从十数万首历代宫廷御用秘方中精选近千首经过临床验证的经典方剂，是90年代国内少有的系统整理古代宫廷医学遗产的特色稀缺读物，原版实体书如今市面存量极少，在传统中医养生圈流传度极高。", categoryName: "医", link: "https://pan.quark.cn/s/44004d3000e6" },
      { id: "55", title: "吕祖全书 总六十四卷", desc: "吕祖全书 总六十四卷，六十四卷内容清晰划分为本传、灵迹、经诰、金丹、语录、诗文六大板块，既收录《锺吕传道集》等核心丹道经典，也包含大量民间扶乩降鸾的劝善经文、吕祖灵签、宝忏内容，完整呈现清初江南地区吕祖信仰的地方特色 。", categoryName: "奇异杂集", link: "https://pan.quark.cn/s/065e3698359e" },
      { id: "54", title: "旧书-道家养生书籍 2册", desc: "旧书-道家养生书籍 2册‌是一套从80-90年代国内正式出版的道家养生绝版老书中精选出的稀缺经典合集，两册内容互补搭配，完整还原传统道家“性命双修”的核心养生体系，原版实体书如今市面存量极少，是国内传统养生圈流传度极高的道家养生入门珍藏级资料。", categoryName: "山", link: "https://pan.quark.cn/s/cafa0edf93ea" },
      { id: "53", title: "《中国历史地图集》", desc: "是由中国历史地理学奠基人谭其骧院士主持、复旦大学团队耗时二十余年编撰的国家级权威历史地理巨著，1982年由中国地图出版社正式出版，是建国以来社会科学领域最重要的成果之一，也是国内公认的最系统、最精准的中国历代疆域变迁权威工具书。", categoryName: "奇异杂集", link: "https://pan.quark.cn/s/7d3ae1e50be8" },
      { id: "52", title: "图解奇门遁甲图书PDF版", desc: "图解奇门遁甲图书PDF版是一套专为零基础人群打造的奇门遁甲轻量化入门高清电子资料合集，以传统奇门遁甲经典著作为底本，搭配海量手绘示意图、白话通俗解读，彻底打破“帝王之学”的晦涩门槛，是国内玄学爱好者中流传极广的奇门遁甲入门首选电子资源。", categoryName: "命", link: "https://pan.quark.cn/s/9aa6cfbb9322" },
      { id: "51", title: "千门八将系列", desc: "千门八将系列‌是一套完整收录中国传统江湖博弈智慧的稀缺经典合集，整合了传统千门文化核心典籍、高阳正版长篇小说全系列、现代商业谋略实战指南三大板块内容，完整还原“千门八将”从古代江湖分工体系到当代人性博弈的全脉络，是国内谋略文化爱好者中流传极广的特色稀缺资源包。", categoryName: "奇异杂集", link: "https://pan.quark.cn/s/9429357dc438" },
      { id: "50", title: "500份心理学书籍", desc: "500份心理学书籍是一套覆盖全梯度、全场景的超大全品类心理学电子资料合集，整合500本经典心理学书籍与配套讲义、思维导图、实操素材，从零基础入门读物到高校专业教材全覆盖，是国内心理学爱好者与从业者中流传极广的一站式学习资源包，不用零散搜集资料就能搭建起完整的心理学知识体系。", categoryName: "奇异杂集", link: "https://pan.quark.cn/s/b309d3e4408f" },
      { id: "49", title: "《中国传统工艺全集》14册合集", desc: "本合集共收录 14册PDF电子文献，内容覆盖丝绸织染、中药炮制、传统机械、文物修复、民间手工艺、漆艺、甲胄复原、造纸印刷、酿造、金属工艺、金银细金工艺、景泰蓝、陶瓷、雕塑等多个领域。 这套资料适合作为中国科技史、传统手工艺、非物质文化遗产保护、文物修复、古代工艺复原与现代设计研究的重要参考。资料整理不易，建议收藏保存。", categoryName: "奇异杂集", link: "https://pan.baidu.com/s/" },
      { id: "48", title: "《溜须拍马术》", desc: "上世纪90年代《溜须拍马术》是1998年由照直言编著、中国社会出版社正式出版的绝版社会文化类书籍，全书共674页，是90年代国内少有的专门剖析传统人情社会人际沟通潜规则的特色著作，原版实体书如今市面存量极少，属于国内旧书圈流传度极高的稀缺绝版读物。", categoryName: "奇异杂集", link: "https://pan.baidu.com/s/" },
      { id: "47", title: "中国功夫系列图书", desc: "该资源是一套系统整理中华传统武术全体系的稀缺经典合集，全面收录国内各大武术流派的核心传承著作，覆盖拳法套路、内功心法、器械技法、养生功法四大核心板块，是国内武术爱好者中流传极广的传统功夫完整学习资料，完整度与稀缺性在同类武术合集中首屈一指。", categoryName: "山", link: "https://pan.quark.cn/s/eb6fa4ab08c7" },
      { id: "46", title: "古盖天之学也《周髀算经》", desc: "周髀算经二卷，古盖天之学也。以勾股之法，度天地之高厚，推日月之运行，而得其度数。 其书出于商、周之间，自周公受之于商高，周人志之，谓之周髀，其所从来远矣。 隋书经籍志有周髀一卷，赵婴注周髀一卷，甄鸾重述。 而唐之艺文志天文类有赵婴注周髀一卷，甄鸾注周髀一卷。 其历算类仍有李淳风注周髀算经二卷，本此一书耳。", categoryName: "卜", link: "https://pan.quark.cn/s/37467edf2438" },
      { id: "45", title: "80年代绝版书籍《养气功健身法》", desc: "该资源是由当代著名武术家、中医养生家马礼堂先生所著的经典传统养生气功专著，1985年由人民体育出版社首次正式出版，全书共150页，是80年代国内气功热潮中最具权威性的正版养生气功入门典籍，原版实体书如今市面存量极少，属于国内传统养生圈公认的稀缺绝版经典资料。", categoryName: "山", link: "https://pan.quark.cn/s/b0f2cec1ccfa" },
      { id: "44", title: "《风水宝典》", desc: "《风水宝典：500个居家布局禁忌与旺运技巧》并非玄学指南，而是一本以环境心理学与传统空间智慧为双核的‌现代家居优化手册‌。本书将千年风水实践转化为可落地的‌500个空间调优策略‌，聚焦于“气流管理”“阴阳平衡”与“动静分区”三大核心原则，重构人与居住空间的互动关系。", categoryName: "相", link: "https://pan.quark.cn/s/c425c2bcc6d7" },
      { id: "43", title: "中小学全科教辅资料合集", desc: "这套中小学全科教辅资料合集，覆盖1～9年级上下册内容，囊括多种热门练习册、同步作业本、单元测试卷、课堂学案、期末复习习题。 资料分类清晰，适合家长打印、学生课后巩固、考前复习，小学初中均可使用，一站式配齐日常练习素材，建议收藏备用。", categoryName: "技能教程", link: "https://pan.quark.cn/s/ce2617cf4155" },
      { id: "42", title: "中医古籍珍稀抄本精选10本", desc: "贯唯集 剑慧草堂医案 济世珍宝 旌孝堂医案 江泽之医案 脉理集要 脉学类编 儒医心镜 伤寒经解 邵氏方案", categoryName: "医", link: "https://pan.quark.cn/s/c06d6f9bd6f1" },
      { id: "41", title: "《河洛阳宅直断心法 印象篇》", desc: "带实战图解100例。主讲宅屋形体、大门玄关、厅堂格局、阴阳人宫对应，搭配户型案例，侧重快速目测判断阳宅吉凶，属于该体系入门实战篇章。", categoryName: "相", link: "https://pan.quark.cn/s/32db68d0b10b" },
      { id: "40", title: "两部绝版手相书", desc: "该资源‌是一套国内玄学圈流传极广的80-90年代绝版手相经典合集，由《中国秘传手相术》1986版与《手纹与人生》2004光明日报版两本稀缺老书组成，原版实体书如今市面存量极少，几乎绝迹，是手相爱好者公认的零基础入门宝藏级绝版资料。", categoryName: "相", link: "https://pan.quark.cn/s/fd4fc382e0d4" },
      { id: "39", title: "10本绝版老菜谱", desc: "该资源‌是一套珍藏级60-90年代经典绝版老菜谱合集，总计2300余页，完整收录10本市面几乎绝迹的传统烹饪老资料，原汁原味还原老一辈的地道烹饪技法与家常风味，是国内餐饮圈流传极广的传统烹饪稀缺参考资源。", categoryName: "技能教程", link: "https://pan.quark.cn/s/7fcad0b28c9f" },
      { id: "38", title: "《600种中草药野外识别高清图谱》", desc: "该资源‌是由北京中医药大学刘春生教授等权威专家编著、化学工业出版社2017年出版的专业野外中草药识别工具书，基于团队多年南北实地考察积累的一手影像资料编纂，是国内目前内容最完整、识别门槛最低的中草药野外识别实用图鉴。", categoryName: "医", link: "https://pan.quark.cn/s/2fe8220bca16" },
      { id: "37", title: "全套占星教学课程合集", desc: "这是一套系统化、阶梯式的数字命理线上教程，专为零基础爱好者及希望深入专业应用的命理研习者设计。课程按照国际数字命理教育标准体系编排，从最基础的1-9核心数字特质、主副数字计算、生命数字（Life Path Number）、灵魂渴望数、个性数等核心要素讲起，逐步过渡到完整出生图谱解读、人际关系匹配，再到高阶的个人年运周期（Personal Year）、挑战与机遇预测、姓名改运分析等实用技术。每一章节均配有真实案例讲解、课后练习与图表工具，帮助学习者建立清晰的数字命理逻辑框架，避免碎片化知识带来的迷茫。无论是出于个人兴趣想了解自己的生命课题，还是希望成为职业命理咨询师，这套课程都能为你提供从入门到精通的完整学习路径。课程注重理性分析与心理学视角，以符号学、原型心理学和能量振动原理阐释数字语言，不涉及迷信或绝对论断，适合现代都市人作为自我探索与人文素养的补充。", categoryName: "卜", link: "https://pan.quark.cn/s/dd3d2d7c08e4" },
      { id: "36", title: "《七经图》", desc: "《七经图》‌是明代万历年间由徽州学者吴继仕编纂的儒家经典珍稀图解古籍，在宋代《六经图》基础上增补《仪礼图》而成，全书共十六卷，以548幅严谨考据的古版画插图系统可视化儒家七部核心经典，是国内现存最早、版刻最精的经学全图体系，也是传世极稀的国学孤本级珍贵文献 。", categoryName: "命", link: "https://pan.quark.cn/s/e5b4e3b3d35e" },
      { id: "35", title: "家居布局智慧：极简风水入门", desc: "该资源是一套完全摒弃传统风水复杂晦涩理论的轻量化居家空间优化资源，以“少即是多”的极简理念重构传统风水智慧，把古人“藏风聚气”的环境哲学转化为普通人零门槛就能落地的家居调整方案，不用罗盘、不用记复杂口诀，靠日常整理就能打造出舒适正向的居家能量场。", categoryName: "相", link: "https://pan.quark.cn/s/ee39765fa8c6" },
      { id: "34", title: "《古法明目功：入门六式+分步演练+手型呼吸》", desc: "基于‌中医经络理论‌，融合手型导引与腹式呼吸，专为缓解屏幕用眼疲劳设计 无需器械、无需场地，每日5–10分钟，零基础可跟练 精讲六式护眼功法，每式分步拆解，配套高清图解与连贯成套训练 针对性刺激‌睛明、太阳、攒竹、丝竹空‌等眼周要穴，改善眼干、眼涩、视物模糊 适配上班族、学生、中老年等长期用眼人群，辅助缓解视觉疲劳", categoryName: "医", link: "https://pan.quark.cn/s/7b7cb071c308" },
      { id: "33", title: "《奇门遁甲秘笈大全》刘伯温·辑", desc: "《奇门遁甲秘笈大全》又名《金函奇门遁甲秘笈全书》《奇门大全》，是中国古代奇门遁甲术数体系的集大成传世典籍，旧题汉・诸葛武侯（诸葛亮）撰，由明代开国元勋、术数大家刘基（刘伯温）辑订、校勘并增补，是民间与学界公认的奇门遁甲标杆性版本，也是与《推背图》同脉的中国古代帝王之学核心经典。", categoryName: "卜", link: "https://pan.quark.cn/s/4716ea4249e8" },
      { id: "32", title: "《麻衣相术》", desc: "中国相面术第一传世经典，民间流传最广、体系最完整的相术蓝本，后世几乎所有相书均以此为根基。全书完整覆盖面相五官、骨骼气色、神态声相、手足身形，以及流年运势的对应法则，是相面术入门与深耕的必读核心。 时间太长、氧化严重，已经修复后，看不清的字迹可以参考其他书籍", categoryName: "相", link: "https://pan.quark.cn/s/9c2ad845186d" },
      { id: "31", title: "《周易图解》古籍", desc: "该资源是一套以“以图释易”为核心的珍稀传统易学图谱类文献，自宋代起由陈抟等易学前贤开创体系，历经宋、元、明、清历代学者增补完善，通过近千幅严谨考据的古版画图谱，把《周易》晦涩抽象的象数义理转化为直观可视的视觉体系，是传承千年的“群经之首”入门核心津梁，也是国内现存体系最完整的易学图解类古籍合集 。", categoryName: "命", link: "https://pan.quark.cn/s/24272309f6e0" },
      { id: "30", title: "钦天监必学《古经天象考》古籍", desc: "该资源是清代著名学者雷学淇耗费十余年心血编撰的中国古代天文历法经典专著，全书共十二卷，附独立图说一卷，是中国古代经学与天文学交叉研究的标杆性著作，清末被刘世珩辑入《聚学轩丛书》正式刊行，如今是研究上古天文历法、传统天人文化的核心珍稀文献，兼具极高的学术价值与神秘文化研究属性。", categoryName: "卜", link: "https://pan.quark.cn/s/9114c8285771" },
      { id: "29", title: "易学简单入门资料", desc: "该资源‌是一套专为零基础人群打造的轻量化易学入门学习合集，整合了韩元茗《易学基础入门》、张延生《易学入门》等权威经典的核心精华内容，完全删去晦涩的学术探讨，只保留普通人能快速上手的必备基础知识点，哪怕完全没有国学基础，也能在短时间内搭建起完整的易学知识框架，是目前玄学爱好者中流传极广的零基础入门首选资料。", categoryName: "卜", link: "https://pan.quark.cn/s/f1e26b56c8b2" },
      { id: "28", title: "《命理基本知识》20章", desc: "该资源是一套专为零基础爱好者打造的体系化八字命理入门教程，全书共20个循序渐进的独立章节，从最基础的阴阳五行概念起步，逐层拆解传统子平八字的完整理论框架，彻底打破传统命理典籍的晦涩门槛，哪怕完全没有国学基础，也能系统掌握八字命理的核心入门知识，是目前玄学爱好者中流传极广的零基础入门经典教程。", categoryName: "命", link: "https://pan.quark.cn/s/3f930ab77e7f" },
      { id: "27", title: "绝版道教符咒手抄本图", desc: "该资源是一套系统整理民间散藏珍稀道教符咒手抄本的高清影印合集，总页数超260页，汇集了不同地区、不同道坛流派的绝版手绘符图与配套口诀记录，是国内目前存量极少的民间道教符箓文化一手文献资料，极具传统民俗文化研究价值与稀缺收藏属性。", categoryName: "山", link: "https://pan.quark.cn/s/bc22b2cbad72" },
      { id: "26", title: "辣条制作配方及教程", desc: "该资源‌是一套面向零基础人群的全场景辣条制作实用教程合集，覆盖家庭自制、摆摊创业两大核心场景，不用复杂专业设备，普通人照着教程就能快速复刻出麻辣鲜香、Q弹有嚼劲的地道辣条，轻松实现辣条自由，甚至可以低成本开启手工辣条副业。", categoryName: "奇异杂集", link: "https://pan.quark.cn/s/81e179e8048f" },

      updateCatIntro();
      let list = resources;
      if (currentCategory !== '全部') {
        list = list.filter(r => r.categoryName === currentCategory);
      }
      if (searchQuery) {
        list = list.filter(r =>
          r.title.toLowerCase().includes(searchQuery) ||
          r.desc.toLowerCase().includes(searchQuery)
        );
      }
      if (countEl) countEl.textContent = list.length;
      listEl.innerHTML = '';
      if (list.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');
      list.forEach((item, i) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.style.animationDelay = Math.min(i * 0.025, 0.3) + 's';
        card.innerHTML =
          '<h2 class="card-title">' + escapeHtml(item.title) + '</h2>' +
          '<p class="card-desc">' + escapeHtml(item.desc) + '</p>' +
          '<div class="card-side">' +
            '<span class="card-tag">' + escapeHtml(item.categoryName) + '</span>' +
            '<span class="card-side-link">查看详情' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>' +
          '</div>';
        card.addEventListener('click', () => openModal(item));
        listEl.appendChild(card);
      });
    }



    function resetContactPanel() {
      modalDownload.style.display = "";
      modalWxId.textContent = CONTACT.wechatId;
      var wxLabel = modalWxId.previousElementSibling;
      if (wxLabel) wxLabel.textContent = "微信号";
      var tip = document.querySelector(".modal-tip");
      if (tip) tip.textContent = "长按识别二维码 · 或搜索微信号添加";
      var contactTitle = document.querySelector(".modal-contact-title");
      if (contactTitle) contactTitle.textContent = "客服微信";
      if (CONTACT.qrImage) {
        modalQr.src = CONTACT.qrImage;
        modalQr.style.display = "block";
        modalQrPlaceholder.style.display = "none";
      } else {
        modalQr.style.display = "none";
        modalQrPlaceholder.style.display = "flex";
        modalQrPlaceholder.textContent = "请替换二维码";
      }
    }

    var contactFab = document.getElementById("contactFab");
    if (contactFab) {
      contactFab.addEventListener("click", function () {
        resetContactPanel();
        modalTag.textContent = "客服";
        modalTitle.textContent = "需要其他资源？";
        modalDesc.textContent = "如果列表中没有你想要的资源，可添加下方客服微信说明需求，我们会尽力帮你查找或整理。";
        modalDownload.style.display = "none";
        mask.classList.add("open");
        document.body.style.overflow = "hidden";
      });
    }

    var officialBtn = document.getElementById("officialBtn");
    if (officialBtn) {
      officialBtn.addEventListener("click", function () {
        modalTag.textContent = "公众号";
        modalTitle.textContent = "公众号：" + (CONTACT.gzhName || "五术推");
        modalDesc.textContent = "扫码关注公众号，获取更多资源与更新通知。";
        modalDownload.style.display = "none";
        if (CONTACT.gzhQr) {
          modalQr.src = CONTACT.gzhQr;
          modalQr.style.display = "block";
          modalQrPlaceholder.style.display = "none";
        } else {
          modalQr.style.display = "none";
          modalQrPlaceholder.style.display = "flex";
          modalQrPlaceholder.textContent = "请配置公众号二维码";
        }
        modalWxId.textContent = CONTACT.gzhName || "五术推";
        var wxLabel = modalWxId.previousElementSibling;
        if (wxLabel) wxLabel.textContent = "公众号";
        var tip = document.querySelector(".modal-tip");
        if (tip) tip.textContent = "长按识别二维码 · 关注公众号";
        var contactTitle = document.querySelector(".modal-contact-title");
        if (contactTitle) contactTitle.textContent = "公众号二维码";
        mask.classList.add("open");
        document.body.style.overflow = "hidden";
      });
    }

    var _openModalCore = openModal;
    openModal = function (item) {
      resetContactPanel();
      _openModalCore(item);
    };


    render();

    // 封面进入：等书法字体就绪再渐显，避免先闪系统字
    (function () {
      var cover = document.getElementById("cover");
      var btn = document.getElementById("coverEnter");
      if (!cover || !btn) return;

      function markReady() {
        cover.classList.add("is-font-ready");
      }

      function waitFont() {
        var done = false;
        function finish() {
          if (done) return;
          done = true;
          markReady();
        }
        // 超时兜底，避免一直不显示
        var timer = window.setTimeout(finish, 2200);
        if (document.fonts && document.fonts.load) {
          document.fonts.load('48px "Ma Shan Zheng"').then(function () {
            return document.fonts.ready;
          }).then(function () {
            window.clearTimeout(timer);
            finish();
          }).catch(function () {
            window.clearTimeout(timer);
            finish();
          });
        } else if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            window.clearTimeout(timer);
            finish();
          });
        } else {
          window.clearTimeout(timer);
          finish();
        }
      }

      waitFont();

      function enter() {
        cover.classList.add("is-hidden");
        document.body.classList.remove("cover-lock");
        window.setTimeout(function () {
          if (cover.parentNode) cover.parentNode.removeChild(cover);
        }, 750);
      }
      btn.addEventListener("click", enter);
    })();

  </script>


<script>
(function () {
  var btn = document.getElementById("backTop");
  if (!btn) return;
  // 若被误放进弹层，挪到 body 末尾
  if (btn.parentElement && btn.parentElement.id === "modalMask") {
    document.body.appendChild(btn);
  }
  function check() {
    var y = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    if (y > 40) btn.classList.add("show");
    else btn.classList.remove("show");
  }
  window.addEventListener("scroll", check, { passive: true });
  window.addEventListener("touchmove", check, { passive: true });
  btn.onclick = function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  check();
})();
</script>
