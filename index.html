<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="极简资源分享 · 学习资料、技能教程、传统文化合集" />
  <title>资源库 · Resource Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --border: #eaeaea;
      --accent: #111111;
      --accent-hover: #333333;
      --tag-bg: #f0f0f0;
      --shadow: 0 1px 3px rgba(0,0,0,0.04);
      --radius: 12px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 250, 250, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      font-family: inherit;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }

    .search-wrap input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      opacity: 0.4;
      pointer-events: none;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
      white-space: nowrap;
    }

    .filter-btn:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Main */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .stats {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stats strong {
      color: var(--text);
      font-weight: 500;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
      opacity: 0;
      animation: fadeIn 0.4s ease forwards;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      border-color: #ddd;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 6px;
      background: var(--tag-bg);
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 0.02em;
      width: fit-content;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card-action {
      margin-top: 4px;
    }

    .card-action a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      padding: 8px 0;
      transition: color var(--transition);
    }

    .card-action a:hover {
      color: var(--accent-hover);
    }

    .card-action a svg {
      width: 14px;
      height: 14px;
      transition: transform var(--transition);
    }

    .card-action a:hover svg {
      transform: translateX(3px);
    }

    /* Empty */
    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .empty p {
      font-size: 0.95rem;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 30px 20px;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    /* Loading skeleton optional */
    .hidden {
      display: none !important;
    }
  </style>
</head>

      { id: 174, title: "伤寒论药证实战应用详解合集", desc: "梳理经典典籍中的核心用药辨证思路，结合实际案例拆解，帮助学习者快速理解条文背后的用药逻辑，降低经典中医典籍的学习门槛。", category: "yi", categoryName: "医", link: "https://pan.quark.cn/s/900ba5bbab2e" },

      { id: 167, title: "田里加养小龙虾，一亩多赚1000到3000元", desc: "稻虾共作是稻田里种稻、再养一茬小龙虾的老办法。本文算清10亩起步的成本、一亩田的收支、操作步骤和销路，并提醒三个常见的坑。价格仅为参考区间。", category: "fuye", categoryName: "创业副业", link: "https://pan.quark.cn/s/96c2bb214c2e" },
      { id: 166, title: "林下养土鸡，200只算笔账", desc: "投入多少、月挣多少、手续怎么办、蛋卖给谁，一次讲清。", category: "fuye", categoryName: "创业副业", link: "https://pan.quark.cn/s/30a228bbe8c2" },

      { id: 164, title: "院子空着别浪费，种平菇投入5000元的真实账本", desc: "家里有院子，花3000～7000元就能试种平菇。这篇把设备、菌包、一茬的收支一笔笔算清，教你怎么搭棚、怎么管、怎么找销路，再提醒3个新手最容易踩的坑。", category: "fuye", categoryName: "创业副业", link: "https://pan.quark.cn/s/e6a21231f01f" },

    ];

    // ========== 逻辑 ==========
    const categories = ['全部', ...Array.from(new Set(resources.map(r => r.categoryName)))];
    let currentCategory = '全部';
    let searchQuery = '';

    const grid = document.getElementById('grid');
    const filtersEl = document.getElementById('filters');
    const countEl = document.getElementById('count');
    const emptyEl = document.getElementById('empty');
    const searchInput = document.getElementById('search');

    // 渲染分类按钮
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (cat === '全部' ? ' active' : '');
      btn.textContent = cat;
      btn.dataset.cat = cat;
      btn.addEventListener('click', () => {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
      filtersEl.appendChild(btn);
    });

    // 搜索
    let searchTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchQuery = e.target.value.trim().toLowerCase();
        render();
      }, 200);
    });

    function render() {
      let list = resources;

      if (currentCategory !== '全部') {
        list = list.filter(r => r.categoryName === currentCategory);
      }

      if (searchQuery) {
        list = list.filter(r =>
          r.title.toLowerCase().includes(searchQuery) ||
          r.desc.toLowerCase().includes(searchQuery)
        );
      }

      countEl.textContent = list.length;
      grid.innerHTML = '';

      if (list.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');

      list.forEach((item, i) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.style.animationDelay = `${Math.min(i * 0.03, 0.3)}s`;
        card.innerHTML = `
          <span class="card-tag">${item.categoryName}</span>
          <h2 class="card-title">${escapeHtml(item.title)}</h2>
          <p class="card-desc">${escapeHtml(item.desc)}</p>
          <div class="card-action">
            <a href="${item.link}" target="_blank" rel="noopener noreferrer">
              查看资源
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // 初始渲染
    render();
  </script>
