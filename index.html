<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="五术搬财资源库 · 山医命相卜" />
  <title>五术搬财资源库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 楷体 / 宋体 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- 霞鹜文楷：清晰楷书 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />
  <!-- 开源隶书近似：马善政楷书偏碑味，配合系统隶书优先 -->
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f1e8;
      --surface: #faf7f1;
      --ink: #1a1714;
      --ink-soft: #4a443c;
      --ink-muted: #8a8276;
      --border: rgba(43, 38, 30, 0.12);
      --border-light: rgba(43, 38, 30, 0.08);
      --border-strong: rgba(43, 38, 30, 0.28);
      --accent: #2b261e;
      --hover: rgba(43, 38, 30, 0.04);
      --radius: 4px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --t: 0.35s var(--ease);
      --content: 760px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }
    html, body {
      overflow-x: hidden;
      overflow-y: auto;
      height: auto;
    }

    body {
      font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.8;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      font-size: 16px;
      letter-spacing: 0.02em;
    }

    /* ========== Header ========== */
    header {
      position: relative;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border-light);
      padding: 28px 16px 22px;
    }

    .header-inner {
      max-width: var(--content);
      margin: 0 auto;
      text-align: center;
    }

    .brand { margin-bottom: 20px; }

    .brand h1 {
      font-family: "STLiti", "LiSu", "Baoli SC", "Ma Shan Zheng", "Noto Serif SC", serif;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: var(--ink);
      line-height: 1.35;
    }

    .brand p {
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--ink-muted);
      letter-spacing: 0.22em;
      font-family: "LXGW WenKai", "KaiTi", "STKaiti", serif;
    }

    .search-wrap {
      position: relative;
      max-width: 100%;
      margin: 0 auto 14px;
    }

    .search-wrap input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 0.9rem;
      color: var(--ink);
      outline: none;
      font-family: "Noto Serif SC", "Songti SC", serif;
      transition: border-color var(--t);
    }

    .search-wrap input:focus {
      border-color: var(--border-strong);
      box-shadow: none;
    }

    .search-wrap input::placeholder {
      color: var(--ink-muted);
      letter-spacing: 0.06em;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      opacity: 0.32;
      pointer-events: none;
    }


    /* ===== 分类 · 古目录式 ===== */
    .filters {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 8px 0 4px;
      max-width: 100%;
    }

    .filter-layer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0;
      width: 100%;
      padding: 10px 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .filter-layer::-webkit-scrollbar { display: none; }

    /* 层间细线分隔 */
    .filter-layer.layer2,
    .filter-layer.layer3 {
      border-top: 1px solid rgba(43, 38, 30, 0.08);
    }

    .filter-btn {
      position: relative;
      flex-shrink: 0;
      margin: 0;
      padding: 6px 14px;
      border: none;
      border-radius: 0;
      background: transparent;
      font-family: "LXGW WenKai", "KaiTi", "STKaiti", "Noto Serif SC", serif;
      font-size: 0.88rem;
      color: rgba(42, 38, 30, 0.48);
      cursor: pointer;
      letter-spacing: 0.2em;
      white-space: nowrap;
      transition: color 0.35s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    /* 山医命相卜：字间更疏，像卷首纲目 */
    .filter-layer.layer2 .filter-btn {
      padding: 8px 16px;
      font-size: 1.02rem;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
    }

    .filter-layer.layer3 .filter-btn {
      padding: 7px 12px;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      color: rgba(42, 38, 30, 0.42);
    }

    .filter-layer.layer1 .filter-btn {
      padding: 6px 20px;
      font-size: 0.92rem;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
    }

    .filter-btn:hover {
      color: var(--ink);
      background: transparent;
      border: none;
    }

    .filter-btn:active {
      transform: none;
      opacity: 0.85;
    }

    /* 选中：墨色 + 下短线 */
    .filter-btn.active {
      color: var(--ink);
      background: transparent;
      border: none;
      box-shadow: none;
      font-weight: 500;
    }

    .filter-btn.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 1.1em;
      height: 1px;
      background: rgba(43, 38, 30, 0.55);
      transform: translateX(-50%);
    }


    .filter-layer.layer2 .filter-btn + .filter-btn::before {
      content: "·";
      position: absolute;
      left: -0.15em;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(43, 38, 30, 0.22);
      font-size: 0.85em;
      pointer-events: none;
      letter-spacing: 0;
    }

    .filter-layer.layer2 .filter-btn.active::after {
      width: 0.85em;
      bottom: 4px;
    }

    .filter-layer.layer1 .filter-btn.active::after {
      width: 1.4em;
    }



    /* ===== Main 手机 ===== */
    main {
      max-width: var(--content);
      margin: 0 auto;
      padding: 28px 16px 72px;
    }


    .stats {
      text-align: center;
      font-size: 0.8rem;
      color: var(--ink-muted);
      margin-bottom: 16px;
      letter-spacing: 0.1em;
      font-family: "LXGW WenKai", "KaiTi", serif;
    }

    .stats strong {
      color: var(--ink-soft);
      font-weight: 500;
      font-family: "Noto Serif SC", serif;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* 书目式条目：细线分隔，少框 */
    .card {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(43, 38, 30, 0.08);
      border-radius: 0;
      padding: 22px 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background var(--t), padding var(--t);
      opacity: 0;
      animation: fadeUp 0.45s var(--ease) forwards;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }

    .card:first-child {
      border-top: 1px solid rgba(43, 38, 30, 0.08);
    }

    .card:hover {
      background: rgba(43, 38, 30, 0.03);
      transform: none;
    }

    .card:active {
      background: rgba(43, 38, 30, 0.05);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      font-size: 1.02rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--ink);
      letter-spacing: 0.03em;
      order: 1;
    }

    .card-desc {
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      font-size: 0.86rem;
      color: var(--ink-soft);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      order: 2;
    }

    .card-side {
      order: 3;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 6px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    .card-tag {
      font-size: 0.72rem;
      padding: 3px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--ink-muted);
      font-family: "LXGW WenKai", "KaiTi", "STKaiti", serif;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .card-side a {
      font-size: 0.78rem;
      color: var(--ink-muted);
      text-decoration: none;
      letter-spacing: 0.08em;
      font-family: "LXGW WenKai", "KaiTi", serif;
      transition: color var(--t);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      -webkit-tap-highlight-color: transparent;
    }

    .card-side a:active { color: var(--ink); }

    .card-side a svg {
      width: 12px;
      height: 12px;
    }

    .empty {
      text-align: center;
      padding: 56px 16px;
      color: var(--ink-muted);
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      font-family: "LXGW WenKai", "KaiTi", serif;
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      padding: 28px 16px 40px;
      font-size: 0.72rem;
      color: var(--ink-muted);
      border-top: 1px solid var(--border-light);
      letter-spacing: 0.1em;
      font-family: "LXGW WenKai", "KaiTi", serif;
    }

    /* ========== 平板 ========== */
    @media (min-width: 600px) {
      header { padding: 24px 20px 20px; }
      .brand h1 { font-size: 1.85rem; letter-spacing: 0.16em; }
      .search-wrap { max-width: 440px; }
      .filter-layer {
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 10px;
      }
      .filter-btn {
        font-size: 0.9rem;
        padding: 8px 16px;
      }
      .filter-layer.layer2 .filter-btn { min-width: 0; }
      .filter-layer.layer3 .filter-btn { min-width: 0; }
      main { padding: 24px 20px 64px; }
      .card { padding: 18px 20px; }
    }

    /* ========== 电脑端：大气左右布局 ========== */
    @media (min-width: 860px) {
      body { font-size: 17px; }

      header { padding: 36px 32px 28px; }

      .brand { margin-bottom: 24px; }

      .brand h1 {
        font-size: clamp(2rem, 2.6vw, 2.5rem);
        letter-spacing: 0.2em;
      }

      .brand p {
        font-size: 0.8rem;
        letter-spacing: 0.28em;
        margin-top: 8px;
      }

      .search-wrap {
        max-width: 480px;
        margin-bottom: 22px;
      }

      .search-wrap input {
        padding: 13px 16px 13px 44px;
        font-size: 0.95rem;
        text-align: center;
      }

      .search-wrap input:focus { text-align: left; }

      .filters {
        align-items: center;
        gap: 12px;
      }

      .filter-layer {
        justify-content: center;
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 12px;
      }

      .filters { gap: 0; max-width: 560px; margin: 0 auto; }
      .filter-layer { gap: 0; padding: 12px 8px; }
      .filter-layer.layer2 .filter-btn {
        font-size: 1.12rem;
        padding: 8px 22px;
        letter-spacing: 0.4em;
        text-indent: 0.4em;
      }
      .filter-layer.layer3 .filter-btn {
        font-size: 0.88rem;
        padding: 8px 16px;
        letter-spacing: 0.16em;
      }
      .filter-layer.layer1 .filter-btn {
        font-size: 0.98rem;
        letter-spacing: 0.4em;
        text-indent: 0.4em;
      }
      .filter-btn:hover { transform: none; }
      .filter-btn:active { transform: none; }
main { padding: 40px 32px 96px; }

      .stats {
        font-size: 0.88rem;
        margin-bottom: 24px;
      }

      .list { gap: 20px; }

      /* 电脑：左文右操作 */
      .card {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        column-gap: 24px;
        row-gap: 8px;
        padding: 26px 28px;
      }

      .card:hover {
        transform: translateY(-1px);
        box-shadow: none;
        border-color: var(--border-strong);
      }

      .card-title {
        grid-column: 1;
        grid-row: 1;
        order: unset;
        font-size: 1.18rem;
      }

      .card-desc {
        grid-column: 1;
        grid-row: 2;
        order: unset;
        font-size: 0.95rem;
      }

      .card-side {
        grid-column: 2;
        grid-row: 1 / 3;
        order: unset;
        flex-direction: column;
        align-items: flex-end;
        justify-content: space-between;
        margin-top: 0;
        padding-top: 0;
        border-top: none;
        min-width: 92px;
        gap: 12px;
      }

      .card-tag {
        font-size: 0.78rem;
        padding: 4px 12px;
      }

      .card-side a {
        font-size: 0.84rem;
      }

      .card-side a:hover {
        color: var(--ink);
        transform: translateX(2px);
      }

      .card-side a svg {
        width: 13px;
        height: 13px;
        transition: transform var(--t);
      }

      .card-side a:hover svg {
        transform: translateX(3px);
      }

      footer {
        padding: 32px 20px;
        font-size: 0.78rem;
      }
    }
  
    
    .card-side-link {
      font-size: 0.78rem;
      color: var(--ink-muted);
      letter-spacing: 0.08em;
      font-family: "LXGW WenKai", "KaiTi", serif;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    @media (min-width: 860px) {
      .card-side-link { font-size: 0.84rem; }
      .card:hover .card-side-link { color: var(--ink); }
    }

    /* ===== 详情弹层 ===== */
    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(26, 23, 20, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.28s var(--ease), visibility 0.28s;
    }

    .modal-mask.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      max-height: min(88vh, 720px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px 28px;
      position: relative;
      transform: translateY(12px) scale(0.98);
      transition: transform 0.4s var(--ease);
      box-shadow: 0 12px 40px rgba(26, 23, 20, 0.12);
    }

    .modal-mask.open .modal {
      transform: translateY(0) scale(1);
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--ink-muted);
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--t), color var(--t), border-color var(--t);
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .modal-close:hover {
      background: var(--hover);
      color: var(--ink);
      border-color: var(--ink-muted);
    }

    .modal-tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 10px;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--ink-muted);
      font-family: "LXGW WenKai", "KaiTi", "STKaiti", serif;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    .modal-title {
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.45;
      color: var(--ink);
      letter-spacing: 0.04em;
      margin-bottom: 14px;
      padding-right: 36px;
    }

    .modal-desc {
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      font-size: 0.92rem;
      color: var(--ink-soft);
      line-height: 1.75;
      margin-bottom: 22px;
      white-space: pre-wrap;
    }

    .modal-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 4px;
      background: var(--accent);
      color: #f6f1e8;
      font-size: 0.95rem;
      font-family: "LXGW WenKai", "KaiTi", serif;
      letter-spacing: 0.16em;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--t), transform var(--t), box-shadow var(--t);
      -webkit-tap-highlight-color: transparent;
    }

    .modal-download:hover {
      background: #3d362c;
      box-shadow: 0 4px 14px rgba(43, 38, 30, 0.25);
    }

    .modal-download:active {
      transform: scale(0.98);
    }

    .modal-divider {
      margin: 24px 0 18px;
      border: none;
      border-top: 1px solid var(--border-light);
    }

    .modal-contact {
      text-align: center;
    }

    .modal-contact-title {
      font-family: "LXGW WenKai", "KaiTi", serif;
      font-size: 0.88rem;
      color: var(--ink-soft);
      letter-spacing: 0.14em;
      margin-bottom: 14px;
    }

    .modal-qr {
      width: 140px;
      height: 140px;
      margin: 0 auto 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      object-fit: contain;
      display: block;
    }

    .modal-qr-placeholder {
      width: 140px;
      height: 140px;
      margin: 0 auto 12px;
      border: 1px dashed var(--border);
      border-radius: 6px;
      background: var(--hover);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      font-size: 0.75rem;
      font-family: "LXGW WenKai", "KaiTi", serif;
      letter-spacing: 0.08em;
    }

    .modal-wx {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 0.9rem;
      color: var(--ink);
      letter-spacing: 0.06em;
    }

    .modal-wx span {
      color: var(--ink-muted);
      font-size: 0.8rem;
      margin-right: 6px;
      font-family: "LXGW WenKai", "KaiTi", serif;
    }

    .modal-tip {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--ink-muted);
      letter-spacing: 0.06em;
      font-family: "LXGW WenKai", "KaiTi", serif;
    }

    /* 卡片可点击提示 */
    .card {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    @media (min-width: 860px) {
      .modal {
        padding: 36px 32px 28px;
        max-width: 560px;
      }
      .modal-title { font-size: 1.35rem; }
      .modal-desc { font-size: 0.98rem; }
      .modal-qr, .modal-qr-placeholder {
        width: 160px;
        height: 160px;
      }
    }

  
    /* 公众号徽章 · 极简内凹 */
    .official-badge {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 18px;
      border-radius: var(--radius);
      background: rgba(43, 38, 30, 0.05);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 2px rgba(40, 32, 20, 0.08);
      font-size: 0.84rem;
      color: rgba(42, 38, 30, 0.7);
      letter-spacing: 0.14em;
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      font-weight: 400;
    }

    /* 需要其他资源 · 联系客服栏 */
    .need-more {
      margin-top: 20px;
      padding: 14px 18px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 16px;
    }

    .need-more-text {
      font-size: 0.82rem;
      color: var(--ink-soft);
      letter-spacing: 0.06em;
      font-family: "LXGW WenKai", "KaiTi", serif;
    }

    .need-more-btn {
      padding: 6px 16px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      background: transparent;
      color: var(--ink);
      font-size: 0.8rem;

    const modalQr = document.getElementById('modalQr');
    const modalQrPlaceholder = document.getElementById('modalQrPlaceholder');
    const modalWxId = document.getElementById('modalWxId');

    modalWxId.textContent = CONTACT.wechatId;
    if (CONTACT.qrImage) {
      modalQr.src = CONTACT.qrImage;
      modalQr.style.display = 'block';
      modalQrPlaceholder.style.display = 'none';
    }

    function makeBtn(cat, container) {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (cat === currentCategory ? ' active' : '');
      btn.type = 'button';
      btn.textContent = cat;
      btn.addEventListener('click', () => {
        currentCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
      container.appendChild(btn);
    }

    ['layer1', 'layer2', 'layer3'].forEach(id => {
      document.getElementById(id).innerHTML = '';
    });
    layer1.forEach(c => makeBtn(c, document.getElementById('layer1')));
    layer2.forEach(c => makeBtn(c, document.getElementById('layer2')));
    layer3.forEach(c => makeBtn(c, document.getElementById('layer3')));

    let searchTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchQuery = e.target.value.trim().toLowerCase();
        render();
      }, 160);
    });

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function openModal(item) {
      modalTag.textContent = item.categoryName;
      modalTitle.textContent = item.title;
      modalDesc.textContent = item.desc;
      modalDownload.href = item.link || '#';
      mask.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      mask.classList.remove('open');
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    mask.addEventListener('click', (e) => {
      if (e.target === mask) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    function render() {
      let list = resources;
      if (currentCategory !== '全部') {
        list = list.filter(r => r.categoryName === currentCategory);
      }
      if (searchQuery) {
        list = list.filter(r =>
          r.title.toLowerCase().includes(searchQuery) ||
          r.desc.toLowerCase().includes(searchQuery)
        );
      }
      if (countEl) countEl.textContent = list.length;
      listEl.innerHTML = '';
      if (list.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');
      list.forEach((item, i) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.style.animationDelay = Math.min(i * 0.025, 0.3) + 's';
        card.innerHTML =
          '<h2 class="card-title">' + escapeHtml(item.title) + '</h2>' +
          '<p class="card-desc">' + escapeHtml(item.desc) + '</p>' +
          '<div class="card-side">' +
            '<span class="card-tag">' + escapeHtml(item.categoryName) + '</span>' +
            '<span class="card-side-link">查看详情' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>' +
          '</div>';
        card.addEventListener('click', () => openModal(item));
        listEl.appendChild(card);
      });
    }



    function resetContactPanel() {
      modalDownload.style.display = "";
      modalWxId.textContent = CONTACT.wechatId;
      var wxLabel = modalWxId.previousElementSibling;
      if (wxLabel) wxLabel.textContent = "微信号";
      var tip = document.querySelector(".modal-tip");
      if (tip) tip.textContent = "长按识别二维码 · 或搜索微信号添加";
      var contactTitle = document.querySelector(".modal-contact-title");
      if (contactTitle) contactTitle.textContent = "客服微信";
      if (CONTACT.qrImage) {
        modalQr.src = CONTACT.qrImage;
        modalQr.style.display = "block";
        modalQrPlaceholder.style.display = "none";
      } else {
        modalQr.style.display = "none";
        modalQrPlaceholder.style.display = "flex";
        modalQrPlaceholder.textContent = "请替换二维码";
      }
    }

    var needMoreBtn = document.getElementById("needMoreBtn");
    if (needMoreBtn) {
      needMoreBtn.addEventListener("click", function () {
        resetContactPanel();
        modalTag.textContent = "客服";
        modalTitle.textContent = "需要其他资源？";
        modalDesc.textContent = "如果列表中没有你想要的资源，可添加下方客服微信说明需求，我们会尽力帮你查找或整理。";
        modalDownload.style.display = "none";
        mask.classList.add("open");
        document.body.style.overflow = "hidden";
      });
    }

    var officialBtn = document.getElementById("officialBtn");
    if (officialBtn) {
      officialBtn.addEventListener("click", function () {
        modalTag.textContent = "公众号";
        modalTitle.textContent = "公众号：" + (CONTACT.gzhName || "五术推");
        modalDesc.textContent = "扫码关注公众号，获取更多资源与更新通知。";
        modalDownload.style.display = "none";
        if (CONTACT.gzhQr) {
          modalQr.src = CONTACT.gzhQr;
          modalQr.style.display = "block";
          modalQrPlaceholder.style.display = "none";
        } else {
          modalQr.style.display = "none";
          modalQrPlaceholder.style.display = "flex";
          modalQrPlaceholder.textContent = "请配置公众号二维码";
        }
        modalWxId.textContent = CONTACT.gzhName || "五术推";
        var wxLabel = modalWxId.previousElementSibling;
        if (wxLabel) wxLabel.textContent = "公众号";
        var tip = document.querySelector(".modal-tip");
        if (tip) tip.textContent = "长按识别二维码 · 关注公众号";
        var contactTitle = document.querySelector(".modal-contact-title");
        if (contactTitle) contactTitle.textContent = "公众号二维码";
        mask.classList.add("open");
        document.body.style.overflow = "hidden";
      });
    }

    var _openModalCore = openModal;
    openModal = function (item) {
      resetContactPanel();
      _openModalCore(item);
    };


    render();

    // 封面进入
    (function () {
      var cover = document.getElementById("cover");
      var btn = document.getElementById("coverEnter");
      if (!cover || !btn) return;
      function enter() {
        cover.classList.add("is-hidden");
        document.body.classList.remove("cover-lock");
        window.setTimeout(function () {
          if (cover.parentNode) cover.parentNode.removeChild(cover);
        }, 750);
      }
      btn.addEventListener("click", enter);
    })();

  </script>


<!-- 回到顶部：必须在 body 下，不能放进弹层 -->
<button type="button" class="back-top" id="backTop" aria-label="回到顶部">↑</button>
<script>
(function () {
  var btn = document.getElementById("backTop");
  if (!btn) return;
  // 若被误放进弹层，挪到 body 末尾
  if (btn.parentElement && btn.parentElement.id === "modalMask") {
    document.body.appendChild(btn);
  }
  function check() {
    var y = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    if (y > 40) btn.classList.add("show");
    else btn.classList.remove("show");
  }
  window.addEventListener("scroll", check, { passive: true });
  window.addEventListener("touchmove", check, { passive: true });
  btn.onclick = function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  check();
})();
</script>
